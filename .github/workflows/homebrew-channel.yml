# Attaches the Homebrew Channel package to each release. The store's listing
# reads releases/latest/download/<id>.manifest.json, so a published release is
# what users get; a pre-release is never "latest" and reaches only those who
# install it by hand.
name: Homebrew Channel

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.release.tag_name, '-mod.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The server's updater compares the tag against TVWEB_VERSION, and the
      # package is named from TVWEB_VERSION; a mismatch would ship one version
      # under the other's name.
      - name: tag matches the version in the code
        run: |
          code=$(sed -n "s/^var TVWEB_VERSION = '\([^']*\)';.*/\1/p" server/tvweb.js)
          tag="${GITHUB_REF_NAME#v}"
          [ "$code" = "$tag" ] || { echo "tag v$tag, but server/tvweb.js says $code"; exit 1; }

      # LG's packager: the store's checks reject packages without the control
      # fields it writes. Pinned, so a new release of it cannot change a build.
      - name: install ares-package
        run: npm install -g @webos-tools/cli@3.2.6

      - name: build
        run: python3 scripts/build-ipk.py

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.ipk dist/*.manifest.json dist/repo.json --clobber

      - name: publish the direct catalog URL
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CATALOG_BRANCH: launcher-weather-waldsee
        run: |
          python3 - <<'PYCODE'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          branch = os.environ['CATALOG_BRANCH']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          if api('repos/' + repo + '/releases/latest')['tag_name'] != tag:
              print('A newer stable release already exists; catalog left unchanged.')
              raise SystemExit(0)
          endpoint = 'repos/' + repo + '/contents/repo.json'
          current = api(endpoint + '?ref=' + branch)
          data = Path('dist/repo.json').read_bytes()
          if base64.b64decode(current['content']) == data:
              print('Catalog already current.')
              raise SystemExit(0)
          payload = {
              'message': 'Update Homebrew catalog for ' + tag,
              'branch': branch, 'sha': current['sha'],
              'content': base64.b64encode(data).decode('ascii'),
          }
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json') as body:
              json.dump(payload, body)
              body.flush()
              subprocess.check_call(['gh', 'api', '--method', 'PUT', endpoint,
                                     '--input', body.name, '--silent'])
          PYCODE
